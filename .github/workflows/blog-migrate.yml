name: Monthly blog migration (EN → JP)

on:
  schedule:
    # 1st of every month at 09:00 UTC (18:00 JST)
    - cron: "0 9 1 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Target month (YYYY-MM). Leave empty to auto-calculate previous month."
        required: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Calculate target month
        id: month
        run: |
          if [ -n "${{ github.event.inputs.month }}" ]; then
            echo "value=${{ github.event.inputs.month }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(date -d '1 month ago' '+%Y-%m')" >> "$GITHUB_OUTPUT"
          fi

      - name: Run migration
        id: migrate
        env:
          EN_USERNAME: ${{ secrets.EN_USERNAME }}
          EN_APP_PASSWORD: ${{ secrets.EN_APP_PASSWORD }}
          JP_USERNAME: ${{ secrets.JP_USERNAME }}
          JP_APP_PASSWORD: ${{ secrets.JP_APP_PASSWORD }}
        run: |
          OUTPUT=$(python blog-migrate/wp_migrate.py --month "${{ steps.month.outputs.value }}" 2>&1)
          echo "$OUTPUT"
          SUMMARY=$(echo "$OUTPUT" | sed -n '/__SUMMARY_JSON__/{n;p;}')
          echo "summary=$SUMMARY" >> "$GITHUB_OUTPUT"

      - name: Notify Lark
        if: always()
        env:
          LARK_WEBHOOK: ${{ secrets.LARK_WEBHOOK }}
        run: |
          SUMMARY='${{ steps.migrate.outputs.summary }}'
          MONTH="${{ steps.month.outputs.value }}"

          NOTIFY_BODY=$(echo "$SUMMARY" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          month = d['month']
          pub = d.get('published', [])
          dra = d.get('drafted', [])
          ski = d.get('skipped', [])
          fai = d.get('failed', [])

          title = f'Blog migration {month} completed' if not fai else f'Blog migration {month} needs attention'
          lines = [title, '', f'Published: {len(pub)} | Drafts: {len(dra)} | Skipped: {len(ski)} | Failed: {len(fai)}']

          if pub:
              lines += ['', 'Published:']
              lines += [f'  • {t}' for t in pub]
          if dra:
              lines += ['', 'Drafts (author not found):']
              for item in dra:
                  lines.append('  • ' + item['title'] + '  [missing: ' + item['missing_author'] + ']')
              lines += ['', 'Review drafts: https://pingcap.co.jp/cms-dashboard/edit.php?post_status=draft']
          if ski:
              lines += ['', 'Skipped (already on JP):']
              lines += [f'  • {t}' for t in ski]
          if fai:
              lines += ['', 'Failed:']
              lines += [f'  • {t}' for t in fai]

          print(json.dumps({'msg_type': 'text', 'content': {'text': chr(10).join(lines)}}))
          " 2>/dev/null || echo '{"msg_type":"text","content":{"text":"Blog migration failed to generate summary"}}')

          curl -s -X POST "$LARK_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$NOTIFY_BODY"
